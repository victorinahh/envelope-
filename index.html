<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Секретное досье</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      min-height: 100vh;
      background: #ffffff;
      padding: 1rem;
    }

    .container { max-width: 400px; margin: 0 auto; }

    .envelope-closed { cursor: pointer; max-width: 400px; margin: 0 auto; }

    .envelope-header { text-align: center; margin-bottom: 1rem; }

    .envelope-label { font-size: 12px; color: #722f37; text-transform: uppercase; letter-spacing: 2px; opacity: 0.7; }

    .envelope-card { background: #ffffff; border: 2px solid #722f37; border-radius: 16px; padding: 2rem; position: relative; overflow: hidden; box-shadow: 0 4px 20px rgba(114,47,55,0.1); }

    .envelope-top { background: #722f37; padding: 1.5rem; margin: -2rem -2rem 1.5rem -2rem; text-align: center; }

    .envelope-subtitle { font-size: 10px; color: rgba(255,255,255,0.7); text-transform: uppercase; letter-spacing: 2px; }

    .envelope-name { font-size: 24px; color: #ffffff; font-weight: 600; margin-top: 4px; }

    .envelope-hint { font-size: 14px; color: #722f37; text-align: center; opacity: 0.7; }

    .seal { width: 56px; height: 56px; background: #722f37; border-radius: 50%; margin: 1.5rem auto; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 16px rgba(114,47,55,0.3); animation: pulse 2s ease-in-out infinite; }

    .seal svg { width: 24px; height: 24px; stroke: #fff; }

    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

    .envelope-open { display: none; max-width: 440px; margin: 0 auto; }

    .card { background: #ffffff; border: 2px solid #722f37; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 20px rgba(114,47,55,0.1); }

    .card-header { background: #722f37; padding: 1.5rem; text-align: center; }

    .card-header-label { font-size: 10px; color: rgba(255,255,255,0.7); text-transform: uppercase; letter-spacing: 2px; }

    .card-header-name { font-size: 24px; color: #ffffff; font-weight: 600; margin-top: 4px; }

    .card-body { padding: 1.5rem; background: #ffffff; }

    .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 1.5rem; }

    .metric { text-align: center; }

    .metric-value { font-size: 24px; font-weight: 700; color: #722f37; }

    .metric-label { font-size: 11px; color: #722f37; opacity: 0.6; margin-top: 4px; }

    .alert { margin-bottom: 1.5rem; }

    .alert-badge { display: inline-block; background: #722f37; color: #fff; font-size: 10px; font-weight: 600; padding: 6px 12px; border-radius: 4px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }

    .alert-text { font-size: 15px; color: #333; line-height: 1.6; padding-left: 12px; border-left: 3px solid #722f37; }

    .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .btn { padding: 14px 20px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; text-align: center; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 6px; }

    .btn-primary { background: #722f37; color: #fff; border: none; }

    .btn-secondary { background: #ffffff; color: #722f37; border: 2px solid #722f37; }

    #confetti-container { position: fixed; inset: 0; pointer-events: none; z-index: 100; overflow: hidden; }

    @keyframes confettiFall { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(720deg); opacity: 0; } }
  </style>
</head>
<body>

<div id="confetti-container"></div>

<div class="container">

  <div class="envelope-closed" id="envelope-closed" onclick="openEnvelope()">
    <div class="envelope-header">
      <span class="envelope-label">Персональное сообщение для</span>
    </div>
    
    <div class="envelope-card">
      <div class="envelope-top">
        <div class="envelope-subtitle">Секретное досье</div>
        <div class="envelope-name">Владимир</div>
      </div>
      
      <div class="envelope-hint">Нажми, чтобы открыть</div>
      
      <div class="seal">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 4 L12 16 M6 10 L12 16 L18 10"/>
        </svg>
      </div>
    </div>
  </div>

  <div class="envelope-open" id="envelope-open">
    <div class="card">
      <div class="card-header">
        <div class="card-header-label">Секретное досье</div>
        <div class="card-header-name">Владимир</div>
      </div>
      
      <div class="card-body">
        <div class="metrics">
          <div class="metric">
            <div class="metric-value">47 500</div>
            <div class="metric-label">подписчиков</div>
          </div>
          <div class="metric">
            <div class="metric-value">340%</div>
            <div class="metric-label">потенциал роста</div>
          </div>
          <div class="metric">
            <div class="metric-value">180К₽</div>
            <div class="metric-label">упущено/мес</div>
          </div>
        </div>
        
        <div class="alert">
          <div class="alert-badge">Обнаружено</div>
          <div class="alert-text">Я нашёл один момент в вашей воронке, которая стоит вам -200К в месяц. Хотите покажу где именно?</div>
        </div>
        
        <div class="buttons">
          <button class="btn btn-primary" onclick="sendResponse('interested')">Что за момент? ↗</button>
          <button class="btn btn-secondary" onclick="sendResponse('contact')">Написать ↗</button>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

function createConfetti() {
  const container = document.getElementById('confetti-container');
  const colors = ['#722f37', '#ffffff', '#a85751', '#d4a5a5', '#f5e6e8'];
  for (let i = 0; i < 60; i++) {
    const confetti = document.createElement('div');
    const size = Math.random() * 10 + 5;
    confetti.style.cssText = `position: absolute; width: ${size}px; height: ${size * 0.4}px; background: ${colors[Math.floor(Math.random() * colors.length)]}; left: ${Math.random() * 100}%; top: -20px; opacity: ${Math.random() * 0.5 + 0.5}; animation: confettiFall ${Math.random() * 2 + 2}s ease-out forwards; animation-delay: ${Math.random() * 0.5}s;`;
    container.appendChild(confetti);
  }
  setTimeout(() => container.innerHTML = '', 4000);
}

function openEnvelope() {
  if (tg?.HapticFeedback) { tg.HapticFeedback.impactOccurred('medium'); }
  createConfetti();
  document.getElementById('envelope-closed').style.display = 'none';
  document.getElementById('envelope-open').style.display = 'block';
}

function sendResponse(action) {
  if (tg) { tg.sendData(JSON.stringify({ action: action, timestamp: Date.now() })); }
  else { alert('Напиши мне в Telegram!'); }
}
</script>

</body>
</html>

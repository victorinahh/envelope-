

<div id="app" style="padding: 2rem 0; font-family: var(--font-sans);">
  
  <!-- Закрытый конверт -->
  <div id="envelope-closed" style="cursor: pointer; max-width: 400px; margin: 0 auto;">
    <div style="text-align: center; margin-bottom: 1rem;">
      <span style="font-size: 12px; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 2px;">Персональное сообщение для</span>
    </div>
    <div style="background: var(--color-background-primary); border: 1px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 2rem; position: relative; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.08);">
      <!-- Красный клапан конверта -->
      <div style="position: absolute; top: 0; left: 0; right: 0; height: 70px; background: #e63946; clip-path: polygon(0 0, 50% 100%, 100% 0);"></div>
      <!-- Красная полоска снизу -->
      <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 6px; background: #e63946;"></div>
      <div style="text-align: center; padding-top: 50px;">
        <div style="font-size: 24px; color: var(--color-text-primary); font-weight: 500; margin-bottom: 8px;">Владимир</div>
        <div style="font-size: 14px; color: var(--color-text-secondary);">Открыть</div>
        <!-- Красная сургучная печать -->
        <div style="margin-top: 24px; display: inline-flex; align-items: center; justify-content: center; width: 56px; height: 56px; background: #e63946; border-radius: 50%; box-shadow: 0 2px 8px rgba(230,57,70,0.4); animation: pulse 2s infinite;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M12 4 L12 16 M6 10 L12 16 L18 10" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>
    </div>
  </div>

  <!-- Открытое содержимое -->
  <div id="envelope-open" style="display: none; max-width: 440px; margin: 0 auto;">
    <div style="background: var(--color-background-primary); border: 1px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.08);">
      
      <!-- Заголовок с красной полосой -->
      <div style="background: #e63946; padding: 1.5rem; text-align: center;">
        <div style="font-size: 11px; color: rgba(255,255,255,0.7); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 4px;">Секретное досье</div>
        <div style="font-size: 20px; color: #fff; font-weight: 500;">Владимир</div>
      </div>
      
      <!-- Контент -->
      <div style="padding: 1.5rem;">
        
        <!-- Статистика -->
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 1.5rem;">
          <div style="background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 12px; text-align: center;">
            <div id="stat1" style="font-size: 24px; font-weight: 500; color: #e63946;">50000</div>
            <div style="font-size: 11px; color: var(--color-text-secondary);">подписчиков</div>
          </div>
          <div style="background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 12px; text-align: center;">
            <div id="stat2" style="font-size: 24px; font-weight: 500; color: #e63946;">50%</div>
            <div style="font-size: 11px; color: var(--color-text-secondary);">потенциал роста</div>
          </div>
          <div style="background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 12px; text-align: center;">
            <div id="stat3" style="font-size: 24px; font-weight: 500; color: #e63946;">100000₽</div>
            <div style="font-size: 11px; color: var(--color-text-secondary);">упущено/мес</div>
          </div>
        </div>
        
        <!-- Сообщение -->
        <div style="background: var(--color-background-secondary); border-left: 4px solid #e63946; border-radius: 0; padding: 1rem; margin-bottom: 1.5rem; position: relative;">
          <div style="position: absolute; top: -10px; left: 12px; background: #e63946; color: #fff; font-size: 10px; padding: 3px 10px; border-radius: 4px; text-transform: uppercase; font-weight: 500;">Обнаружено</div>
          <p id="typed-text" style="font-size: 14px; line-height: 1.6; color: var(--color-text-primary); margin: 8px 0 0 0; min-height: 60px;"></p>
        </div>
        
        <!-- Кнопки -->
        <div style="display: flex; gap: 12px;">
          <button onclick="sendPrompt('Расскажи подробнее про эту идею с оффером')" style="flex: 1; padding: 12px 16px; font-size: 14px; background: #e63946; color: #fff; border: none; border-radius: var(--border-radius-md); cursor: pointer; font-weight: 500;">
            Что за момент? ↗
          </button>
          <button onclick="sendPrompt('Сгенерируй мне готовый текст сообщения для эксперта')" style="flex: 1; padding: 12px 16px; font-size: 14px; border: 1px solid #e63946; color: #e63946; background: transparent; border-radius: var(--border-radius-md); cursor: pointer; font-weight: 500;">
            Написать ↗
          </button>
        </div>
        
      </div>
    </div>
  </div>

</div>

<style>
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}
</style>

<script>
const closedEnv = document.getElementById('envelope-closed');
const openEnv = document.getElementById('envelope-open');

closedEnv.onclick = () => {
  closedEnv.style.transition = 'all 0.4s ease';
  closedEnv.style.transform = 'scale(0.95) translateY(-10px)';
  closedEnv.style.opacity = '0';
  
  setTimeout(() => {
    closedEnv.style.display = 'none';
    openEnv.style.display = 'block';
    openEnv.style.opacity = '0';
    openEnv.style.transform = 'translateY(20px)';
    
    setTimeout(() => {
      openEnv.style.transition = 'all 0.4s ease';
      openEnv.style.opacity = '1';
      openEnv.style.transform = 'translateY(0)';
    }, 50);
    
    // Анимация цифр
    animateValue('stat1', 0, 47500, 1500, '', '');
    animateValue('stat2', 0, 340, 1800, '', '%');
    animateValue('stat3', 0, 180, 2000, '', 'K₽');
    
    // Эффект печатающегося текста
    setTimeout(() => typeText(), 800);
  }, 350);
};

function animateValue(id, start, end, duration, prefix, suffix) {
  const el = document.getElementById(id);
  const range = end - start;
  const startTime = performance.now();
  
  function update(currentTime) {
    const elapsed = currentTime - startTime;
    const progress = Math.min(elapsed / duration, 1);
    const eased = 1 - Math.pow(1 - progress, 3);
    const current = Math.floor(start + range * eased);
    el.textContent = prefix + current.toLocaleString('ru-RU') + suffix;
    if (progress < 1) requestAnimationFrame(update);
  }
  requestAnimationFrame(update);
}

function typeText() {
  const text = "Я нашёл один момент в вашей воронке, которая стоит вам -200К в месяц. Хотите покажу где именно - или сами найдёте?)";
  const el = document.getElementById('typed-text');
  let i = 0;
  
  function type() {
    if (i < text.length) {
      el.textContent += text.charAt(i);
      i++;
      setTimeout(type, 30 + Math.random() * 20);
    }
  }
  type();
}
</script>
